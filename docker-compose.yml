services:
  db:
    image: postgres:16-alpine
    container_name: smart_inventory_db
    environment:
      POSTGRES_DB: smart_inventory
      POSTGRES_USER: smart_inventory
      POSTGRES_PASSWORD: smart_inventory_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
